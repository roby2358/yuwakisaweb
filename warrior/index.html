<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warrior</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <canvas id="game"></canvas>

    <!-- Top HUD -->
    <div id="hud">
        <div class="hud-group hud-vitals">
            <span class="bar-wrap"><span class="bar-label">HP</span><span class="bar"><span id="hp-fill" class="bar-fill hp-fill"></span><span id="hp-text" class="bar-text">80/80</span></span></span>
            <span class="bar-wrap"><span class="bar-label">AE</span><span class="bar"><span id="ae-fill" class="bar-fill ae-fill"></span><span id="ae-text" class="bar-text">9/9</span></span></span>
            <span class="bar-wrap"><span class="bar-label">MP</span><span id="mp-info" class="pips"></span></span>
        </div>
        <div class="hud-group hud-growth">
            <span id="level-info">Lv 1</span>
            <span class="bar bar-thin"><span id="xp-fill" class="bar-fill xp-fill"></span></span>
            <span id="xp-text">0/50</span>
        </div>
        <div class="hud-group hud-meta">
            <span id="turn-info">Turn 1</span>
            <span id="gold-info">0g</span>
        </div>
        <button id="end-turn">End Turn</button>
        <button id="btn-char" class="panel-btn" title="Character (C)">C</button>
        <button id="btn-skills" class="panel-btn" title="Skills (S)">S</button>
        <button id="btn-inv" class="panel-btn" title="Inventory (I)">I</button>
        <button id="btn-map" class="panel-btn" title="World map (M)">M</button>
        <button id="new-game">New</button>
        <button id="btn-collapse" class="panel-btn" title="Collapse / expand side panel">☰</button>
    </div>

    <!-- Bottom context bar -->
    <div id="context-bar">
        <span id="ctx-terrain">Plains</span>
        <span id="ctx-entity"></span>
    </div>

    <!-- Skill bar -->
    <div id="skill-bar">
        <div class="skill-slot" id="ranged-slot"><span class="skill-key">R</span><span class="skill-icon"></span><span class="skill-name">Ranged</span><span class="skill-cost"></span></div>
        <div class="skill-slot" data-slot="0"><span class="skill-key">1</span><span class="skill-icon"></span><span class="skill-name">-</span><span class="skill-cost"></span></div>
        <div class="skill-slot" data-slot="1"><span class="skill-key">2</span><span class="skill-icon"></span><span class="skill-name">-</span><span class="skill-cost"></span></div>
        <div class="skill-slot" data-slot="2"><span class="skill-key">3</span><span class="skill-icon"></span><span class="skill-name">-</span><span class="skill-cost"></span></div>
        <div class="skill-slot" data-slot="3"><span class="skill-key">4</span><span class="skill-icon"></span><span class="skill-name">-</span><span class="skill-cost"></span></div>
        <div class="skill-slot" data-slot="4"><span class="skill-key">5</span><span class="skill-icon"></span><span class="skill-name">-</span><span class="skill-cost"></span></div>
    </div>

    <!-- Character panel -->
    <div id="char-panel" class="side-panel hidden">
        <h3>Character</h3>
        <div id="char-stats"></div>
        <div id="char-derived"></div>
        <div id="char-equipment"></div>
        <div id="char-metrics"></div>
    </div>

    <!-- Skills panel -->
    <div id="skills-panel" class="side-panel hidden">
        <h3>Skills</h3>
        <div id="skills-list"></div>
    </div>

    <!-- Inventory panel -->
    <div id="inv-panel" class="side-panel hidden">
        <h3>Inventory</h3>
        <div id="inv-gold"></div>
        <div id="inv-list"></div>
    </div>

    <!-- Dialog overlay (haven, camp, shop, level-up, skill choice) -->
    <div id="dialog-overlay" class="hidden">
        <div id="dialog-box">
            <div id="dialog-title"></div>
            <div id="dialog-body"></div>
            <div id="dialog-buttons"></div>
        </div>
    </div>

    <!-- Game over / victory overlay -->
    <div id="endgame-overlay" class="hidden">
        <div id="endgame-box">
            <div id="endgame-title"></div>
            <div id="endgame-body"></div>
            <button id="endgame-newgame">New Game</button>
        </div>
    </div>

    <!-- Intro overlay -->
    <div id="intro-overlay">
        <div id="intro-box">
            <div id="intro-title">WARRIOR</div>
            <div id="intro-buttons">
                <button id="intro-continue" disabled>Continue</button>
                <button id="intro-new">New Game</button>
            </div>
        </div>
    </div>

    <!-- Combat log -->
    <div id="combat-log"></div>
    <button id="log-pin-btn" title="Pin combat log (keep entries visible)">PIN</button>

    <!-- Plain script includes (shared globals), not ES modules, so the page runs
         when opened straight from disk. Order = dependency order. -->
    <script src="rando.js"></script>
    <script src="colortheory.js"></script>
    <script src="config.js"></script>
    <script src="hex.js"></script>
    <script src="player.js"></script>
    <script src="world.js"></script>
    <script src="skilllibrary.js"></script>
    <script src="enemies.js"></script>
    <script src="actions.js"></script>
    <script src="enemy_ai.js"></script>
    <script src="victory.js"></script>
    <script src="sound.js"></script>
    <script src="sprite_sheet.js"></script>
    <script src="fx.js"></script>
    <script src="index.js"></script>
</body>
</html>
