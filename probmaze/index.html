<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Probability Maze</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="https://jelly-ui.com/package.js"></script>
</head>
<body>
<jelly-theme mode="dark">
  <header>
    <h1>Probability Maze</h1>
  </header>
  <main>
    <canvas id="board" width="900" height="600"></canvas>
    <aside id="panel">
      <section id="die-section">
        <div id="die" class="die"></div>
        <jelly-button id="roll">Roll</jelly-button>
      </section>
      <jelly-alert id="message" tone="info" size="small"></jelly-alert>
      <section id="scores">
        <div>Rolls <jelly-badge id="rolls" live variant="azure">0</jelly-badge></div>
        <div>Par <jelly-badge id="par" variant="platinum"></jelly-badge></div>
        <div>Best <jelly-badge id="best" live variant="amber">—</jelly-badge></div>
      </section>
      <section id="faces">
        <h2>Die faces</h2>
        <div id="face-list"></div>
      </section>
      <section id="controls">
        <jelly-button id="retry" variant="graphite" size="small">Retry maze</jelly-button>
        <jelly-button id="new-maze" variant="graphite" size="small">New maze</jelly-button>
      </section>
    </aside>
  </main>
</jelly-theme>
<script src="js/delaunay.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
