<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex &amp; Counters</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud-stack">
        <div id="hud" class="panel">
            <span id="turn-info">Turn 1</span>
            <span id="progress">
                <span class="progress-label">Progress to end</span>
                <span id="progress-bar"><span id="progress-fill"></span></span>
                <span id="progress-pct">0%</span>
            </span>
            <span class="buttons">
                <button id="end-turn" class="btn primary">End Turn</button>
                <button id="new-game" class="btn">New Game</button>
            </span>
        </div>
        <div id="hud-hover" class="panel hidden"><span id="hover-info"></span></div>
    </div>
    <div id="intro-panel" class="panel">
        <h1>Hex &amp; Counters</h1>
        <p>Move your counter <strong>P</strong> to the target <strong>&#9733;</strong>.
            Enemies wander and block the way.</p>
        <dl class="keys">
            <dt><kbd>Click</kbd> P</dt><dd>select, then click a yellow hex to move</dd>
            <dt><kbd>Drag</kbd></dt><dd>pan the map</dd>
            <dt><kbd>Space</kbd></dt><dd>end turn</dd>
            <dt><kbd>Esc</kbd></dt><dd>deselect</dd>
        </dl>
        <button id="begin-btn" class="btn primary">Begin</button>
    </div>
    <!-- NOTE! We want to be able to double-click to run these games, so use plain
    script includes (globals), not ES module imports. Order = dependency order:
    artifacts → display artifacts → libs → piece/board → state → engine → ui → bootstrap. -->
    <script src="artifacts.js"></script>
    <script src="displayartifacts.js"></script>
    <script src="rando.js"></script>
    <script src="colortheory.js"></script>
    <script src="hex.js"></script>
    <script src="piece.js"></script>
    <script src="board.js"></script>
    <script src="sound.js"></script>
    <script src="gamestate.js"></script>
    <script src="gameengine.js"></script>
    <script src="gameui.js"></script>
    <script src="index.js"></script>
</body>
</html>
