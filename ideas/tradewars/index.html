<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caravans &amp; Conquest</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud-stack">
        <div id="hud">
            <span id="turn-info">Turn 1</span>
            <span id="mp-info">MP: 5/5</span>
            <span id="cargo-info"></span>
            <span id="progress">
                <span class="progress-label">Influence</span>
                <span id="progress-bar"><span id="progress-fill"></span></span>
                <span id="influence-info"></span>
            </span>
            <span id="unrest-info"></span>
            <button id="contract">Contract</button>
            <button id="supplies">Buy Supplies</button>
            <button id="end-turn">End Turn</button>
            <button id="new-game">New Game</button>
        </div>
        <div id="hud-hover" class="hidden"><span id="hover-info"></span></div>
    </div>
    <div id="event-log"></div>
    <div id="intro-panel">
        <h1>Caravans &amp; Conquest</h1>
        <p>Gather timber and ore, trade contracts at markets, and reach the Crown Market with 15 influence. Raiders can be fought for coin, but force raises unrest.</p>
        <p class="hint">Click your caravan to move or attack. Space ends the turn. Left-drag pans the map.</p>
        <button id="begin-btn">Begin</button>
    </div>
    <!-- NOTE! We want to be able to double-click to run these games, so use plain
    script includes (globals), not ES module imports. Order = dependency order:
    artifacts → display artifacts → libs → piece/domain/board → state → engine → ui → bootstrap. -->
    <script src="artifacts.js"></script>
    <script src="rando.js"></script>
    <script src="colortheory.js"></script>
    <script src="displayartifacts.js"></script>
    <script src="hex.js"></script>
    <script src="piece.js"></script>
    <script src="domain.js"></script>
    <script src="board.js"></script>
    <script src="sound.js"></script>
    <script src="gamestate.js"></script>
    <script src="gameengine.js"></script>
    <script src="gameui.js"></script>
    <script src="index.js"></script>
</body>
</html>
